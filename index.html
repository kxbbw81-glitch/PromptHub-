<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="keywords" content="AI提示词, Prompt, AI图像生成, 提示词库, Midjourney, Stable Diffusion" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍌</text></svg>" />

<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="logo" onclick="navigate('home')">
        <div class="logo-icon">🍌</div>
        <span>PromptHub</span>
      </div>
      <nav class="nav">
        <a data-route="home" onclick="navigate('home')">首页</a>
        <a data-route="explore" onclick="navigate('explore')">探索提示词</a>
        <a onclick="navigate('import')">📥 导入</a>
        <a onclick="navigate('collections')">❤️ 我的收藏</a>
        <div class="nav-search">
          <input type="text" id="nav-search-input" placeholder="搜索提示词..." />

      <div class="footer-grid">
        <div class="footer-brand">

            <div class="logo-icon">🍌</div>
            <span>PromptHub</span>

        </div>
        <div class="footer-col">
          <h4>探索</h4>
          <a onclick="navigate('explore')">全部提示词</a>
          <a onclick="navigate('home'); setTimeout(()=>document.getElementById('categories-section')?.scrollIntoView({behavior:'smooth'}),100)">主题分类</a>
          <a onclick="navigate('home'); setTimeout(()=>document.querySelector('.top-prompts')?.scrollIntoView({behavior:'smooth'}),100)">今日精选</a>
        </div>
        <div class="footer-col">
          <h4>分类</h4>
          <a onclick="navigate('explore')">人像</a>
          <a onclick="navigate('explore')">风景</a>
          <a onclick="navigate('explore')">科幻</a>
          <a onclick="navigate('explore')">奇幻</a>
        </div>
        <div class="footer-col">

          <a onclick="navigate('home'); setTimeout(()=>document.querySelector('.prompt-eng')?.scrollIntoView({behavior:'smooth'}),100)">提示词工程</a>

        <span>© 2025 PromptHub. 保留所有权利。</span>
        <span>用 🍌 和 AI 打造</span>
