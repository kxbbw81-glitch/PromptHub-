<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 200px;
      max-height: 520px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: #FAFAF8;
      color: #1A1A1A;
      overflow-y: auto;
    }
    .header {
      background: linear-gradient(135deg, #FFD93D, #FFE066);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 32px;
      height: 32px;
      background: #1A1A1A;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 800;
    }
    .header-sub {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }
    .toolbar {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #EAEAEA;
    }
    .btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
    }
    .btn-primary {
      background: #1A1A1A;
      color: #fff;
    }
    .btn-secondary {
      background: #fff;
      border: 1.5px solid #1A1A1A;
      color: #1A1A1A;
    }
    .content {
      padding: 12px 16px;
    }
    .status {
      font-size: 13px;
      color: #666;
      text-align: center;
      padding: 20px;
    }
    .prompt-item {
      background: #fff;
      border: 1px solid #EAEAEA;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .prompt-item:hover {
      border-color: #FFD93D;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .prompt-item-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prompt-item-text {
      font-size: 11px;
      color: #666;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .prompt-item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .prompt-item-cat {
      font-size: 10px;
      font-weight: 700;
      color: #E6B800;
      text-transform: uppercase;
    }
    .prompt-item-actions {
      display: flex;
      gap: 6px;
    }
    .mini-btn {
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .mini-btn-collect {
      background: #FFD93D;
      color: #1A1A1A;
    }
    .mini-btn-copy {
      background: #1A1A1A;
      color: #fff;
    }
    .queue-bar {
      border-top: 1px solid #EAEAEA;
      padding: 10px 16px;
      background: #fff;
    }
    .queue-info {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-bottom: 8px;
    }
    .btn-sync {
      width: 100%;
      padding: 8px;
      background: #FFD93D;
      color: #1A1A1A;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-sync:hover {
      background: #FFC700;
      transform: scale(1.02);
    }
    .empty-state {
      text-align: center;
      padding: 30px 20px;
    }
    .empty-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .empty-text {
      font-size: 13px;
      color: #999;
    }
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1A1A1A;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      z-index: 100;
      transition: all 0.3s;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🍌</div>
    <div>
      <div class="header-title">PromptHub</div>
      <div class="header-sub">AI 提示词收集器</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" id="btn-scan">🔍 扫描页面</button>
    <button class="btn btn-secondary" id="btn-open">🌐 打开网站</button>
  </div>

  <div class="content" id="content">
    <div class="status">点击「扫描页面」检测当前网页上的 AI 提示词</div>
  </div>

  <div class="queue-bar" id="queue-bar" style="display:none;">
    <div class="queue-info" id="queue-info"></div>
    <button class="btn btn-sync" id="btn-sync">🔄 同步到 PromptHub</button>
  </div>
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
