name: Release Domestic Collections

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/release-domestic-collections.js
      - run: |
          if git diff --quiet -- data/collections.json; then
            exit 0
          fi
          git config user.name "prompthub-sync[bot]"
          git config user.email "prompthub-sync[bot]@users.noreply.github.com"
          git add data/collections.json
          git commit -m "data: release domestic collections"
          git pull --rebase origin main
          git push origin HEAD:main
