name: Merge Extension Inbox

on:
  push:
    paths:
      - 'data/inbox/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompthub-extension-inbox
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the latest main data
        run: git pull --ff-only origin main
      - name: Merge extension inbox
        run: node scripts/merge-extension-inbox.js --apply
      - name: Validate collection data and parser behavior
        run: node --test tests/*.test.js
      - name: Commit merged extension collections
        run: |
          if git diff --quiet -- data/collections.json data/inbox; then
            exit 0
          fi
          git config user.name "prompthub-extension[bot]"
          git config user.email "prompthub-extension[bot]@users.noreply.github.com"
          git add data/collections.json data/inbox
          git commit -m "data: merge extension inbox"
          git pull --rebase origin main
          git push origin HEAD:main
